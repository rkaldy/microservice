name: CI (development)

on:
  push:
    branches-ignore:
      - master

permissions:
  contents: read

concurrency:
  group: ci-dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.2" "pre-commit>=4.2,<5"

      - name: Build development image
        run: make build BUILD_TARGET=dev

      - name: Lint
        run: make lint

      - name: Start development environment
        run: make up-d COMPOSE_UP_ARGS="--wait --wait-timeout 120 api"

      - name: Test
        run: make test DOCKER_EXEC_FLAGS=

      - name: Show container logs
        if: failure()
        run: make logs

      - name: Stop development environment
        if: always()
        run: make down

  deploy:
    name: Push image and deploy
    needs: build-lint-test
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GKE_CLUSTER_LOCATION }}-docker.pkg.dev" --quiet

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_CLUSTER_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Push development image
        run: |
          make push \
            BUILD_TARGET=dev \
            DOCKER_REGISTRY="${{ vars.GKE_CLUSTER_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/docker"

      - name: Deploy to development cluster
        run: |
          make install \
            BUILD_TARGET=dev \
            DOCKER_REGISTRY="${{ vars.GKE_CLUSTER_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/docker"
