name: CI (dev)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.2" "pre-commit>=4.2,<5"

      - name: Build development image
        run: make build BUILD_TARGET=dev

      - name: Lint
        run: make lint

      - name: Start development environment
        run: make up-d COMPOSE_UP_ARGS="--wait --wait-timeout 120 api"

      - name: Test
        run: make test DOCKER_EXEC_FLAGS=

      - name: Show container logs
        if: failure()
        run: make logs

      - name: Stop development environment
        if: always()
        run: make down
