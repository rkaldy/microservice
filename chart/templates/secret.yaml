apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secret
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.app.environment }}-db-password
    - secretKey: BEARER_TOKEN
      remoteRef:
        key: {{ .Values.app.environment }}-bearer-token
